<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background-color: #0b1329; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow-1" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-2" cx="85%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#065f46" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassmorphism Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base & Glows -->
  <rect width="1920" height="1080" fill="#0b1329"/>
  <rect width="1920" height="1080" fill="url(#bg-glow-1)"/>
  <rect width="1920" height="1080" fill="url(#bg-glow-2)"/>

  <!-- Subtle Grid Accent Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1080"/>
    <line x1="1840" y1="0" x2="1840" y2="1080"/>
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="1000" x2="1920" y2="1000"/>
  </g>

  <!-- ==================================================== -->
  <!-- HEADER SECTION                                       -->
  <!-- ==================================================== -->
  <g transform="translate(100, 75)">
    <!-- Category Pill Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
    <text x="32" y="22" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">PROJECT METHODOLOGY</text>

    <!-- Main Title -->
    <text x="0" y="80" font-size="46" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
      Technical Stack &amp; Core Architecture
    </text>

    <!-- Subtitle -->
    <text x="0" y="116" font-size="19" font-weight="500" fill="#94a3b8">
      AI-Powered Question Paper Generation &amp; Multi-Constraint Academic Assessment System (GMRIT / JNTU)
    </text>
  </g>

  <!-- ==================================================== -->
  <!-- 3x2 GLASS CARDS GRID                                 -->
  <!-- ==================================================== -->

  <!-- CARD 1: Generative AI & LLM Engine (Row 1, Col 1) -->
  <g transform="translate(100, 230)">
    <rect width="540" height="350" rx="20" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="540" height="6" rx="3" fill="#38bdf8"/>
    
    <!-- Header with Icon -->
    <g transform="translate(32, 35)">
      <rect width="48" height="48" rx="12" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="24" y="32" font-size="22" text-anchor="middle">✨</text>
      <text x="64" y="24" font-size="22" font-weight="800" fill="#f8fafc">Generative AI &amp; LLM</text>
      <text x="64" y="44" font-size="14" font-weight="600" fill="#38bdf8">Curriculum-Grounded Synthesis</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(36, 120)">
      <circle cx="6" cy="14" r="4.5" fill="#38bdf8"/>
      <text x="24" y="19" font-size="16.5" font-weight="700" fill="#e2e8f0">Google Gemini 1.5 Flash</text>
      <text x="24" y="42" font-size="14" fill="#94a3b8">Primary instruction-tuned LLM for structured questions</text>

      <circle cx="6" cy="80" r="4.5" fill="#38bdf8"/>
      <text x="24" y="85" font-size="16.5" font-weight="700" fill="#e2e8f0">RAG Context Matching (rag_service.py)</text>
      <text x="24" y="108" font-size="14" fill="#94a3b8">Top-K semantic retrieval to eliminate hallucination</text>

      <circle cx="6" cy="146" r="4.5" fill="#38bdf8"/>
      <text x="24" y="151" font-size="16.5" font-weight="700" fill="#e2e8f0">Deterministic Local Fallback</text>
      <text x="24" y="174" font-size="14" fill="#94a3b8">Offline-capable algorithmic synthesis with full uptime</text>
    </g>
  </g>

  <!-- CARD 2: Document Extraction & Parsing (Row 1, Col 2) -->
  <g transform="translate(690, 230)">
    <rect width="540" height="350" rx="20" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="540" height="6" rx="3" fill="#a855f7"/>
    
    <!-- Header with Icon -->
    <g transform="translate(32, 35)">
      <rect width="48" height="48" rx="12" fill="#7c3aed" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.2"/>
      <text x="24" y="32" font-size="22" text-anchor="middle">📄</text>
      <text x="64" y="24" font-size="22" font-weight="800" fill="#f8fafc">Document Extraction</text>
      <text x="64" y="44" font-size="14" font-weight="600" fill="#c084fc">Syllabus Ingestion &amp; Chunking</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(36, 120)">
      <circle cx="6" cy="14" r="4.5" fill="#c084fc"/>
      <text x="24" y="19" font-size="16.5" font-weight="700" fill="#e2e8f0">PyMuPDF (fitz) Document Parser</text>
      <text x="24" y="42" font-size="14" fill="#94a3b8">High-throughput ingestion of PDF, DOCX, and TXT</text>

      <circle cx="6" cy="80" r="4.5" fill="#c084fc"/>
      <text x="24" y="85" font-size="16.5" font-weight="700" fill="#e2e8f0">Unit &amp; Module Chunker</text>
      <text x="24" y="108" font-size="14" fill="#94a3b8">Automated segmentation into Units 1–5 &amp; topics</text>

      <circle cx="6" cy="146" r="4.5" fill="#c084fc"/>
      <text x="24" y="151" font-size="16.5" font-weight="700" fill="#e2e8f0">Course Outcome (CO) Harvester</text>
      <text x="24" y="174" font-size="14" fill="#94a3b8">Automatic mapping of learning outcomes (CO1–CO6)</text>
    </g>
  </g>

  <!-- CARD 3: Optimization & Constraints (Row 1, Col 3) -->
  <g transform="translate(1280, 230)">
    <rect width="540" height="350" rx="20" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="540" height="6" rx="3" fill="#10b981"/>
    
    <!-- Header with Icon -->
    <g transform="translate(32, 35)">
      <rect width="48" height="48" rx="12" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1.2"/>
      <text x="24" y="32" font-size="22" text-anchor="middle">⚖️</text>
      <text x="64" y="24" font-size="22" font-weight="800" fill="#f8fafc">Optimization Engine</text>
      <text x="64" y="44" font-size="14" font-weight="600" fill="#34d399">Multi-Constraint Solver</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(36, 120)">
      <circle cx="6" cy="14" r="4.5" fill="#34d399"/>
      <text x="24" y="19" font-size="16.5" font-weight="700" fill="#e2e8f0">Bloom's Taxonomy Balancer (L1–L6)</text>
      <text x="24" y="42" font-size="14" fill="#94a3b8">Proportional distribution from Remember to Create</text>

      <circle cx="6" cy="80" r="4.5" fill="#34d399"/>
      <text x="24" y="85" font-size="16.5" font-weight="700" fill="#e2e8f0">Difficulty Parity (Easy, Med, Hard)</text>
      <text x="24" y="108" font-size="14" fill="#94a3b8">Equi-difficulty balancing across internal OR choice pairs</text>

      <circle cx="6" cy="146" r="4.5" fill="#34d399"/>
      <text x="24" y="151" font-size="16.5" font-weight="700" fill="#e2e8f0">Cross-Section Topic Deduplication</text>
      <text x="24" y="174" font-size="14" fill="#94a3b8">Eliminates repeated concept overlap across sections</text>
    </g>
  </g>

  <!-- CARD 4: Full-Stack Web Core (Row 2, Col 1) -->
  <g transform="translate(100, 620)">
    <rect width="540" height="350" rx="20" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="540" height="6" rx="3" fill="#38bdf8"/>
    
    <!-- Header with Icon -->
    <g transform="translate(32, 35)">
      <rect width="48" height="48" rx="12" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="24" y="32" font-size="22" text-anchor="middle">⚡</text>
      <text x="64" y="24" font-size="22" font-weight="800" fill="#f8fafc">Full-Stack Core</text>
      <text x="64" y="44" font-size="14" font-weight="600" fill="#38bdf8">Python Flask &amp; React (Vite)</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(36, 120)">
      <circle cx="6" cy="14" r="4.5" fill="#38bdf8"/>
      <text x="24" y="19" font-size="16.5" font-weight="700" fill="#e2e8f0">Python 3.11+ &amp; Flask REST API</text>
      <text x="24" y="42" font-size="14" fill="#94a3b8">Modular Blueprint routing, CORS, and pipeline controllers</text>

      <circle cx="6" cy="80" r="4.5" fill="#38bdf8"/>
      <text x="24" y="85" font-size="16.5" font-weight="700" fill="#e2e8f0">React 18 &amp; Vite SPA Dashboard</text>
      <text x="24" y="108" font-size="14" fill="#94a3b8">Real-time blueprint creator, live editor, and previewer</text>

      <circle cx="6" cy="146" r="4.5" fill="#38bdf8"/>
      <text x="24" y="151" font-size="16.5" font-weight="700" fill="#e2e8f0">Role-Based Access Architecture</text>
      <text x="24" y="174" font-size="14" fill="#94a3b8">Granular dashboards for Admin, HOD, Faculty, &amp; Student</text>
    </g>
  </g>

  <!-- CARD 5: Persistence & Security (Row 2, Col 2) -->
  <g transform="translate(690, 620)">
    <rect width="540" height="350" rx="20" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="540" height="6" rx="3" fill="#f59e0b"/>
    
    <!-- Header with Icon -->
    <g transform="translate(32, 35)">
      <rect width="48" height="48" rx="12" fill="#d97706" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="24" y="32" font-size="22" text-anchor="middle">🛡️</text>
      <text x="64" y="24" font-size="22" font-weight="800" fill="#f8fafc">Persistence &amp; Security</text>
      <text x="64" y="44" font-size="14" font-weight="600" fill="#fbbf24">PostgreSQL &amp; Token Auth</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(36, 120)">
      <circle cx="6" cy="14" r="4.5" fill="#fbbf24"/>
      <text x="24" y="19" font-size="16.5" font-weight="700" fill="#e2e8f0">PostgreSQL 18 Relational DB</text>
      <text x="24" y="42" font-size="14" fill="#94a3b8">qpdb storage with Flask-SQLAlchemy relational ORM</text>

      <circle cx="6" cy="80" r="4.5" fill="#fbbf24"/>
      <text x="24" y="85" font-size="16.5" font-weight="700" fill="#e2e8f0">PyJWT Secure Authentication</text>
      <text x="24" y="108" font-size="14" fill="#94a3b8">Cryptographic tokens with Werkzeug PBKDF2 hashing</text>

      <circle cx="6" cy="146" r="4.5" fill="#fbbf24"/>
      <text x="24" y="151" font-size="16.5" font-weight="700" fill="#e2e8f0">QP Versioning &amp; Archival Store</text>
      <text x="24" y="174" font-size="14" fill="#94a3b8">Multi-set generation history with full audit compliance</text>
    </g>
  </g>

  <!-- CARD 6: Academic Standards & Output (Row 2, Col 3) -->
  <g transform="translate(1280, 620)">
    <rect width="540" height="350" rx="20" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.4" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="540" height="6" rx="3" fill="#ec4899"/>
    
    <!-- Header with Icon -->
    <g transform="translate(32, 35)">
      <rect width="48" height="48" rx="12" fill="#db2777" fill-opacity="0.25" stroke="#ec4899" stroke-width="1.2"/>
      <text x="24" y="32" font-size="22" text-anchor="middle">🎓</text>
      <text x="64" y="24" font-size="22" font-weight="800" fill="#f8fafc">Standards &amp; Export</text>
      <text x="64" y="44" font-size="14" font-weight="600" fill="#f472b6">JNTU / GMRIT Compliance</text>
    </g>

    <!-- Bullet Points -->
    <g transform="translate(36, 120)">
      <circle cx="6" cy="14" r="4.5" fill="#f472b6"/>
      <text x="24" y="19" font-size="16.5" font-weight="700" fill="#e2e8f0">Print-Ready PDF Generation</text>
      <text x="24" y="42" font-size="14" fill="#94a3b8">Standardized institutional headers, tables, and marks</text>

      <circle cx="6" cy="80" r="4.5" fill="#f472b6"/>
      <text x="24" y="85" font-size="16.5" font-weight="700" fill="#e2e8f0">Student Evaluation Engine</text>
      <text x="24" y="108" font-size="14" fill="#94a3b8">10-character JNTU roll-number tracking with FIFO marks</text>

      <circle cx="6" cy="146" r="4.5" fill="#f472b6"/>
      <text x="24" y="151" font-size="16.5" font-weight="700" fill="#e2e8f0">CO-PO Attainment Analytics</text>
      <text x="24" y="174" font-size="14" fill="#94a3b8">Comprehensive assessment reporting and mark charts</text>
    </g>
  </g>

  <!-- ==================================================== -->
  <!-- FOOTER BAR                                           -->
  <!-- ==================================================== -->
  <g transform="translate(100, 1025)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#64748b">GMR Institute of Technology • Department of Information Technology / CSE</text>
    <text x="1720" y="0" font-size="14" font-weight="600" fill="#64748b" text-anchor="end">Project Methodology Review • 2026</text>
  </g>
</svg>
